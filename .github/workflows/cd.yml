name: CD Pipeline (Release to DockerHub)

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # --- BACKEND ---
      - name: Build and push Backend
        uses: docker/build-push-action@v4
        with:
          context: .   
          push: true
          tags: |
            dawidkaminski/projekt-backend:latest
            dawidkaminski/projekt-backend:${{ github.ref_name }}

      # --- FRONTEND ---
      - name: Build and push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./library-canvas-main
          push: true
          tags: |
            dawidkaminski/projekt-frontend:latest
            dawidkaminski/projekt-frontend:${{ github.ref_name }}

  deploy:
    needs: build-and-push  
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/apps/DOM
            git fetch --all
            git checkout main
            git pull
            docker compose pull
            docker compose up -d
            docker image prune -f
